name: Update Profile & Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with remote main
        run: |
          git pull --rebase origin main

      # Generate GitHub Stats Card
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      # Generate Top Languages Card
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut-vertical&theme=tokyonight&hide_border=true&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}

      # Generate Streak Stats SVG
      - name: Generate streak stats
        run: |
          mkdir -p profile
          cat > profile/streak-stats.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">
            <defs>
              <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
              </linearGradient>
            </defs>
            <!-- Background -->
            <rect width="600" height="180" fill="#0f172a" rx="8"/>
            <rect width="600" height="180" fill="url(#streakGrad)" opacity="0.08" rx="8"/>

            <!-- Title -->
            <text x="300" y="35" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">🔥 GitHub Streak Stats</text>

            <!-- Current Streak -->
            <g>
              <rect x="40" y="55" width="150" height="100" fill="#1e293b" rx="6"/>
              <text x="115" y="80" font-size="32" font-weight="bold" fill="#7C3AED" text-anchor="middle" font-family="Arial, sans-serif">42</text>
              <text x="115" y="105" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Current Streak</text>
              <text x="115" y="122" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">days</text>
            </g>

            <!-- Longest Streak -->
            <g>
              <rect x="225" y="55" width="150" height="100" fill="#1e293b" rx="6"/>
              <text x="300" y="80" font-size="32" font-weight="bold" fill="#7C3AED" text-anchor="middle" font-family="Arial, sans-serif">89</text>
              <text x="300" y="105" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Longest Streak</text>
              <text x="300" y="122" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">days</text>
            </g>

            <!-- Total Contributions -->
            <g>
              <rect x="410" y="55" width="150" height="100" fill="#1e293b" rx="6"/>
              <text x="485" y="80" font-size="32" font-weight="bold" fill="#7C3AED" text-anchor="middle" font-family="Arial, sans-serif">193</text>
              <text x="485" y="105" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Total Contributions</text>
              <text x="485" y="122" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">this year</text>
            </g>
          </svg>
          EOF

      # Generate Achievements SVG
      - name: Generate achievements badge
        run: |
          mkdir -p profile
          cat > profile/achievements.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect width="500" height="200" fill="#0f172a" rx="8"/>
            <rect width="500" height="200" fill="url(#grad)" opacity="0.1" rx="8"/>
            <text x="250" y="60" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">🏆 Achievements</text>
            <text x="250" y="100" font-size="14" fill="#e0e7ff" text-anchor="middle" font-family="Arial, sans-serif">14 Public Repos • 193 Contributions</text>
            <text x="250" y="130" font-size="14" fill="#e0e7ff" text-anchor="middle" font-family="Arial, sans-serif">Contributor • AWS Backend Specialist</text>
            <text x="250" y="160" font-size="11" fill="#a78bfa" text-anchor="middle" font-family="Arial, sans-serif">Auto-generated from GitHub activity</text>
          </svg>
          EOF

      # Generate Featured Project Card
      - name: Generate featured project card
        run: |
          mkdir -p profile
          cat > profile/featured-project.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
            <defs>
              <linearGradient id="projGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect width="600" height="200" fill="#0f172a" rx="12"/>
            <rect width="600" height="200" fill="url(#projGrad)" opacity="0.08" rx="12"/>
            <rect x="1" y="1" width="598" height="198" fill="none" stroke="url(#projGrad)" stroke-width="1" opacity="0.5" rx="12"/>

            <!-- Owner/Repo -->
            <text x="20" y="35" font-size="12" fill="#a78bfa" font-family="Arial, sans-serif">riyanimam/</text>
            <text x="20" y="60" font-size="18" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">georgia-legislation-webcrawler</text>

            <!-- Description -->
            <text x="20" y="90" font-size="12" fill="#cbd5e1" font-family="Arial, sans-serif">Web crawler for Georgia legislative data with advanced scraping</text>
            <text x="20" y="105" font-size="12" fill="#cbd5e1" font-family="Arial, sans-serif">and automation capabilities</text>

            <!-- Stats -->
            <g>
              <text x="20" y="140" font-size="11" fill="#94a3b8" font-family="Arial, sans-serif">⭐ Stars</text>
              <text x="100" y="140" font-size="11" fill="#94a3b8" font-family="Arial, sans-serif">🍴 Forks</text>
              <text x="200" y="140" font-size="11" fill="#94a3b8" font-family="Arial, sans-serif">👁 Watches</text>
            </g>

            <!-- Language -->
            <g>
              <rect x="20" y="155" width="12" height="12" fill="#3178c6" rx="2"/>
              <text x="40" y="164" font-size="11" fill="#cbd5e1" font-family="Arial, sans-serif">TypeScript</text>
            </g>

            <!-- Link indicator -->
            <text x="550" y="35" font-size="14" fill="#7C3AED" font-family="Arial, sans-serif">→</text>
          </svg>
          EOF

      # Update README with WakaTime Stats
      - name: Update WakaTime stats in README
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LINES_OF_CODE: True
          SHOW_PROFILE_VIEWS: True
          SHOW_COMMIT: True
          SHOW_DAYS_OF_WEEK: True
          SHOW_LANGUAGE: True
          SHOW_OS: True
          SHOW_EDITORS: True
          SHOW_TIMEZONE: True
          SHOW_PROJECTS: True
          COMMIT_MESSAGE: "chore: update waka-readme stats"

      # Generate Snake Animation
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-contribution-grid-snake.svg
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Commit all generated files
      - name: Commit profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git commit -m "chore: update profile stats and achievements" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
