name: Update Profile & Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with remote main
        run: |
          git pull --rebase origin main

      # Generate GitHub Stats Card
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      # Generate Top Languages Card
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut-vertical&theme=tokyonight&hide_border=true&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}

      # Generate Achievements SVG
      - name: Generate achievements badge
        run: |
          mkdir -p profile
          cat > profile/achievements.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect width="500" height="200" fill="#0f172a" rx="8"/>
            <rect width="500" height="200" fill="url(#grad)" opacity="0.1" rx="8"/>
            <text x="250" y="60" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">🏆 Achievements</text>
            <text x="250" y="100" font-size="14" fill="#e0e7ff" text-anchor="middle" font-family="Arial">14 Public Repos | 183 Contributions</text>
            <text x="250" y="130" font-size="14" fill="#e0e7ff" text-anchor="middle" font-family="Arial">Contributor | AWS & Backend Specialist</text>
            <text x="250" y="160" font-size="12" fill="#a78bfa" text-anchor="middle" font-family="Arial">Generated automatically from GitHub activity</text>
          </svg>
          EOF

      # Update README with WakaTime Stats
      - name: Update WakaTime stats in README
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LINES_OF_CODE: True
          SHOW_PROFILE_VIEWS: True
          SHOW_COMMIT: True
          SHOW_DAYS_OF_WEEK: True
          SHOW_LANGUAGE: True
          SHOW_OS: True
          SHOW_EDITORS: True
          SHOW_TIMEZONE: True
          SHOW_PROJECTS: True
          COMMIT_MESSAGE: "chore: update waka-readme stats"

      # Generate Snake Animation
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Deploy Snake Animation to output branch
      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # Commit all generated files
      - name: Commit profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git commit -m "chore: update profile stats and achievements" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
