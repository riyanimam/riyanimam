<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="projGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="200" fill="#0f172a" rx="12"/>
  <rect width="600" height="200" fill="url(#projGrad)" opacity="0.08" rx="12"/>
  <rect x="1" y="1" width="598" height="198" fill="none" stroke="url(#projGrad)" stroke-width="1" opacity="0.5" rx="12"/>

  <!-- Owner/Repo -->
  <text x="20" y="35" font-size="12" fill="#a78bfa" font-family="Arial, sans-serif">riyanimam/</text>
  <text x="20" y="60" font-size="18" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">georgia-legislation-webcrawler</text>

  <!-- Description -->
  <text x="20" y="90" font-size="12" fill="#cbd5e1" font-family="Arial, sans-serif">Web crawler for Georgia legislative data with advanced scraping</text>
  <text x="20" y="105" font-size="12" fill="#cbd5e1" font-family="Arial, sans-serif">and automation capabilities</text>

  <!-- Stats -->
  <g>
    <text x="20" y="140" font-size="11" fill="#94a3b8" font-family="Arial, sans-serif">⭐ Stars</text>
    <text x="100" y="140" font-size="11" fill="#94a3b8" font-family="Arial, sans-serif">🍴 Forks</text>
    <text x="200" y="140" font-size="11" fill="#94a3b8" font-family="Arial, sans-serif">👁 Watches</text>
  </g>

  <!-- Language -->
  <g>
    <rect x="20" y="155" width="12" height="12" fill="#3178c6" rx="2"/>
    <text x="40" y="164" font-size="11" fill="#cbd5e1" font-family="Arial, sans-serif">TypeScript</text>
  </g>

  <!-- Link indicator -->
  <text x="550" y="35" font-size="14" fill="#7C3AED" font-family="Arial, sans-serif">→</text>
</svg>
